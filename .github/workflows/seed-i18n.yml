name: Seed i18n files (copy FR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed missing locale files by copying FR
        shell: bash
        run: |
          set -euo pipefail

          MASTER="fr"
          LOCALES=("en" "es" "de" "it")

          # Find all FR md/mdx files (anywhere in repo)
          mapfile -t FR_FILES < <(find . -type f \( -name "*.md" -o -name "*.mdx" \) -path "./${MASTER}/*" | sed 's|^\./||')

          if [ ${#FR_FILES[@]} -eq 0 ]; then
            echo "No FR files found under ./${MASTER}/"
            exit 0
          fi

          for fr in "${FR_FILES[@]}"; do
            rel="${fr#${MASTER}/}" # remove leading "fr/"
            for loc in "${LOCALES[@]}"; do
              target="${loc}/${rel}"
              if [ ! -f "${target}" ]; then
                mkdir -p "$(dirname "${target}")"
                cp "${fr}" "${target}"
                echo "Created ${target} from ${fr}"
              fi
            done
          done

      - name: Commit generated files (if any)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: seed i18n files (copy FR)"
            git push
          else
            echo "Nothing to commit."
          fi
